# Builds the three images that docker-compose.yml pulls, for amd64 (Hostinger VPS) and arm64.
# A release tag (v2026.09.25) publishes :latest and :2026.09.25, which is what installs run; the dashboard shows
# "Update available" when a newer release exists. A push to main only publishes :edge, so installs never get
# unreleased code.
name: images
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: engine, context: ., file: Dockerfile }
          - { name: web, context: ., file: deploy/web.Dockerfile }
          - { name: backup, context: deploy, file: deploy/backup.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: tags
        env:
          IMG: ghcr.io/${{ steps.owner.outputs.lc }}/beebots-${{ matrix.name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            printf 'list<<EOF\n%s:latest\n%s:%s\n%s:%s\nEOF\n' "$IMG" "$IMG" "$v" "$IMG" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            printf 'list<<EOF\n%s:edge\n%s:%s\nEOF\n' "$IMG" "$IMG" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: APP_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
