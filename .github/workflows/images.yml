# Publish the engine, dashboard and backup images used by the Arcane project.
name: images
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir dashboard install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: pnpm build && pnpm --dir dashboard build
      - run: docker compose --env-file .env.example config --quiet

  build:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: engine, context: ., file: Dockerfile }
          - { name: web, context: ., file: deploy/web.Dockerfile }
          - { name: backup, context: deploy, file: deploy/backup.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: tags
        env:
          IMG: ghcr.io/${{ steps.owner.outputs.lc }}/catfolio-${{ matrix.name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            printf 'list<<EOF\n%s:latest\n%s:%s\n%s:%s\nEOF\n' "$IMG" "$IMG" "$v" "$IMG" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            printf 'list<<EOF\n%s:edge\n%s:%s\nEOF\n' "$IMG" "$IMG" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: APP_VERSION=${{ steps.tags.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Record published image
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.lc }}/catfolio-${{ matrix.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "### $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit tag: \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
