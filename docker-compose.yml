name: catfolio
services:
  engine:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # This Compose file is intentionally PAPER-only.
      DRY_RUN: "true"
      MODE: paper
      DB_PATH: ${DOCKER_DB_PATH:-/data/catfolio-paper.sqlite}
      SETTINGS_PATH: /data/catfolio-settings.json
      ENGINE_BIND: 0.0.0.0
      ENGINE_PORT: "8080"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DAILY_USD_CAP: ${GEMINI_DAILY_USD_CAP:-3}
      LM_STUDIO_ORIGIN: ${LM_STUDIO_HOST_ORIGIN:-http://host.docker.internal:1234}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - catfolio-data:/data
    stop_grace_period: 60s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [engine]
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8088}:8080"
    volumes:
      - catfolio-web-data:/data
      - catfolio-web-config:/config
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  backup:
    build:
      context: deploy
      dockerfile: backup.Dockerfile
    restart: unless-stopped
    volumes:
      - catfolio-data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  catfolio-data:
  catfolio-web-data:
  catfolio-web-config:
